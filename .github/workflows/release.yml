name: Android Release

# ─────────────────────────────────────────────────────────────
# This workflow runs automatically every time you publish a new
# version tag (e.g. v1.0, v1.1, v2.0) to the repository.
# It builds a signed APK and attaches it to a GitHub Release.
# ─────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*"          # triggers on any tag that starts with v

permissions:
  contents: write     # needed to create a GitHub Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the source code
      - name: Check out source code
        uses: actions/checkout@v4

      # 2. Set up Java (Android needs Java to build)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Set up the Android SDK tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install the exact Android SDK version this app needs
      - name: Install Android 36 SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # 5. Set up Gradle (the build tool) with caching for speed
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. Write the signing keystore from GitHub Secrets
      #    (Secrets are encrypted values you store in GitHub – see README for setup)
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SMART_LAUNCHER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SMART_LAUNCHER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMART_LAUNCHER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMART_LAUNCHER_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Make sure all four secrets are present before continuing
          test -n "$KEYSTORE_BASE64" || { echo "❌ Secret SMART_LAUNCHER_KEYSTORE_BASE64 is missing" >&2; exit 1; }
          test -n "$STORE_PASSWORD"  || { echo "❌ Secret SMART_LAUNCHER_STORE_PASSWORD is missing"  >&2; exit 1; }
          test -n "$KEY_ALIAS"       || { echo "❌ Secret SMART_LAUNCHER_KEY_ALIAS is missing"       >&2; exit 1; }
          test -n "$KEY_PASSWORD"    || { echo "❌ Secret SMART_LAUNCHER_KEY_PASSWORD is missing"    >&2; exit 1; }

          # Decode the keystore file from base64
          mkdir -p "${HOME}/.config/smart-launcher"
          echo "$KEYSTORE_BASE64" | base64 -d > "${HOME}/.config/smart-launcher/release.keystore"

          # Write the signing properties file the build script reads
          printf 'storeFile=%s\nstoreType=PKCS12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${HOME}/.config/smart-launcher/release.keystore" \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > "${HOME}/.config/smart-launcher/signing.properties"

          echo "✅ Signing configuration written successfully"

      # 7. Build the signed release APK
      - name: Build signed release APK
        run: ./gradlew --no-daemon --console=plain assembleRelease

      # 8. Save the APK as a downloadable artifact (always, even if next step fails)
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Launcher-${{ github.ref_name }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 9. Create a GitHub Release and attach the APK to it
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: "Smart Launcher ${{ github.ref_name }}"
          artifacts: "app/build/outputs/apk/release/*.apk"
          artifactContentType: application/vnd.android.package-archive
          generateReleaseNotes: true   # auto-generates changelog from commits
          token: ${{ secrets.GITHUB_TOKEN }}
