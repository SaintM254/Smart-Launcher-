name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 36 SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Configure external release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SMART_LAUNCHER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SMART_LAUNCHER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMART_LAUNCHER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMART_LAUNCHER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing SMART_LAUNCHER_KEYSTORE_BASE64 secret" >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing SMART_LAUNCHER_STORE_PASSWORD secret" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing SMART_LAUNCHER_KEY_ALIAS secret" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing SMART_LAUNCHER_KEY_PASSWORD secret" >&2; exit 1; }
          mkdir -p "${HOME}/.config/smart-launcher"
          echo "$KEYSTORE_BASE64" | base64 -d > "${HOME}/.config/smart-launcher/release.keystore"
          printf 'storeFile=%s\nstoreType=PKCS12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${HOME}/.config/smart-launcher/release.keystore" \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > "${HOME}/.config/smart-launcher/signing.properties"

      - name: Build signed release APK
        run: ./gradlew --no-daemon --console=plain assembleRelease

      - name: Upload release APK as action artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Launcher-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Smart Launcher ${{ github.ref_name }}"
          files: app/build/outputs/apk/release/*.apk
