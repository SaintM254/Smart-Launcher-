name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android 36 SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Lint, unit tests, and debug build
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace lint testDebugUnitTest assembleDebug > gradle-build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path

          lines = Path("gradle-build.log").read_text(errors="replace").splitlines()
          excerpt = "\n".join(lines[-90:])[-6000:]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Gradle build failure excerpt\n\n```text\n" + excerpt + "\n```\n")
          escaped = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build diagnostics::{escaped}")
          PY
            exit "$result"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: smart-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
